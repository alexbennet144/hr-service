spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/hr_db
    username: hr_user
    password: hr_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8082

logging:
  level:
    org.hibernate.SQL: DEBUG
