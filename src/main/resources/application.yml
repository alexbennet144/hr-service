spring:
  application:
    name: hr-service

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    org.springframework: INFO

cognito:
  region: us-east-1
  userPoolId: us-east-1_TOZbkz8xq
  audience: 1fmj0q99hsrk25s8llprks1scp

# Default fallback (can be overridden by profile or env variable)
user:
  base-url: ${USER_BASE_URL:http://localhost:8081}
